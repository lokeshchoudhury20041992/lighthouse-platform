[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node >=20.19; pin so Netlify's default can't regress it.
  NODE_VERSION = "22"

# SPA fallback so react-router paths resolve on a hard refresh / direct link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
